server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los JPEG de las mermas y el bundle de React comprimen bien.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No anunciar la version de Nginx.
    server_tokens off;

    # Tope de subida: las capturas de vision/ son JPEG de una sola botella.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Microservicio desacoplado de Inteligencia Artificial (FastAPI)
    location /ia/ {
        proxy_pass http://servicio_ia:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # API REST del backend Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket de telemetria en vivo (Django Channels)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # Fotos de descarte servidas por Django (MEDIA_URL). Con
    # DJANGO_ALMACENAMIENTO=s3 las sirve el bucket y esto no se usa.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Estaticos del admin de Django (los sirve whitenoise)
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # El bundle de Vite lleva hash en el nombre: se puede cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA de React: cualquier ruta que no matchee un archivo va a index.html
    # (hace falta para /monitoreo, /mermas, etc. al recargar la pagina).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
