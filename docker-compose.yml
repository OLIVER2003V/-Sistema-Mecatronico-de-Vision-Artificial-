services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sortmatic}
      POSTGRES_USER: ${POSTGRES_USER:-sortmatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sortmatic}
    volumes:
      - db_datos:/var/lib/postgresql/data
    # Sin "ports": la base solo se alcanza desde la red interna de compose.
    # Para inspeccionarla desde la PC, descomentar:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sortmatic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-clave-de-desarrollo-cambiar-en-produccion}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CORS_ALLOW_ALL: ${DJANGO_CORS_ALLOW_ALL:-true}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-}
      DJANGO_CSRF_ORIGINS: ${DJANGO_CSRF_ORIGINS:-}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/La_Paz}
      VISION_API_KEY: ${VISION_API_KEY:-clave-vision-de-desarrollo-cambiar-en-produccion}
      JWT_MINUTOS_ACCESO: ${JWT_MINUTOS_ACCESO:-60}
      JWT_DIAS_REFRESCO: ${JWT_DIAS_REFRESCO:-7}
      THROTTLE_LOGIN: ${THROTTLE_LOGIN:-10/min}
      DJANGO_ALMACENAMIENTO: ${DJANGO_ALMACENAMIENTO:-local}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      POSTGRES_DB: ${POSTGRES_DB:-sortmatic}
      POSTGRES_USER: ${POSTGRES_USER:-sortmatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sortmatic}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - media_datos:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  servicio_ia:
    build: ./servicio_ia
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BACKEND_URL: http://backend:8000
      VISION_API_KEY: ${VISION_API_KEY:-clave-vision-de-desarrollo-cambiar-en-produccion}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8001:8001"

volumes:
  db_datos:
  media_datos:

